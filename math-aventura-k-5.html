  function makeQuestions(g,previous){

    const div=()=>{const a=rand(2,9),b=rand(2,9);return task(`${a*b} ÷ ${a} =`,b,`¿Qué número multiplicado por ${a} da ${a*b}?`);};
    let calcs=[],linkPool=[],memoryPool=[],shapePool=grades[g].shapes;
    if(g==='K'){
      const a=rand(1,4),b=rand(1,5),c=rand(5,9),d=rand(1,4),e=rand(1,5);
      calcs=[task(`Hay ${a} patos y llegan ${b}. ¿Cuántos hay?`,a+b,'Junta los dos grupos.'),task(`Tienes ${c} bloques y guardas ${d}. ¿Cuántos quedan?`,c-d,'Cuenta los bloques y quita los que guardas.'),add(1,4),sub(2,9),task(`Hay ${e} estrellas y aparece 1 más. ¿Cuántas hay?`,e+1,'Cuenta una más.')];

      shapePool=[...shapePool,['oval','óvalo']];
    }else if(g==='1'){
      calcs=[add(4,9),sub(10,18),add(4,9),sub(10,18),add(4,9)];
      for(let n=5;n<=18;n++){const a=rand(1,n-1);linkPool.push([`${a} + ${n-a}`,String(n)]);memoryPool.push([`${n+2} − 2`,String(n)]);}
      shapePool=[...shapePool,['pentagon','5 lados'],['octagon','8 lados']];
    }else if(g==='2'){

      calcs=[task(`${a} + ${b} =`,a+b,'Suma decenas y unidades.'),task(`${c} − ${d} =`,c-d,'Resta por partes.'),task(`¿Cuántas decenas hay en ${t*10}?`,t,'Cada decena vale 10.'),task(`Una cinta mide ${l} cm y otra ${m} cm. ¿Cuánto miden juntas?`,l+m,'Suma las dos longitudes.'),task(`¿Cuánto falta de ${start} a 100?`,100-start,'Avanza hasta la próxima decena y después hasta 100.')];
      for(let n=0;n<12;n++){const hundreds=rand(1,4),tens=rand(1,9),ones=rand(1,9),value=hundreds*100+tens*10+ones;if(!linkPool.some(x=>x[1]===String(value)))linkPool.push([`${hundreds} centenas, ${tens} decenas y ${ones} unidades`,String(value)]);}

      calcs=[mul(),div(),task(`${bags} bolsas con ${each} canicas cada una. ¿Cuántas canicas?`,bags*each,'Multiplica el número de bolsas por las canicas de cada bolsa.'),task(`Un rectángulo mide ${l} cm por ${w} cm. ¿Cuál es su perímetro?`,2*(l+w),'Suma sus cuatro lados.'),task(`${boxes*per} lápices en ${boxes} cajas iguales. ¿Cuántos hay por caja?`,per,'Reparte los lápices en grupos iguales.')];
      for(let n=4;n<=36;n++){const divisors=[2,3,4,5,6].filter(d=>n%d===0&&n/d>=2&&n/d<=9);if(divisors.length){const d=pick(divisors);linkPool.push([`${d} × ${n/d}`,String(n)]);memoryPool.push([`${d} × ${n/d}`,String(n)]);}}
      shapePool=[];for(let r=2;r<=4;r++)for(let c=3;c<=6;c++)shapePool.push([`array${r}x${c}`,`${r} filas de ${c}`]);

      for(let n=1;n<10;n++){linkPool.push([`${n}/10`,fmt(n/10)]);memoryPool.push([`${n}/10`,fmt(n/10)]);}
      for(let n=1;n<8;n+=2){linkPool.push([`${n}/8`,fmt(n/8)]);memoryPool.push([`${n}/8`,fmt(n/8)]);}

  function buildCrossword(words){const raw=crossLayouts[words.join('|')];if(!raw)throw Error('Crucigrama no disponible');const placements=raw.map(p=>({...p})),cells=new Map();let rows=0,cols=0;for(const p of placements){for(let k=0;k<p.word.length;k++){const r=p.r+(p.dir==='v'?k:0),c=p.c+(p.dir==='h'?k:0);const key=r+','+c;if(cells.has(key)&&cells.get(key)!==p.word[k])throw Error('Cruce no válido');cells.set(key,p.word[k]);rows=Math.max(rows,r+1);cols=Math.max(cols,c+1);}}placements.sort((a,b)=>a.r-b.r||a.c-b.c);const starts=new Map();placements.forEach(p=>{const key=p.r+','+p.c;if(!starts.has(key))starts.set(key,starts.size+1);p.number=starts.get(key);});return{cells,placements,rows,cols};}

    if(!a.bank){const words=data.map(x=>x[0]),others=[...new Set([...crossVariants[run.grade].flatMap(set=>set.map(x=>x[0])),...distractors[run.grade]])].filter(w=>!words.includes(w));a.bank=shuffle([...words,...shuffle(others).slice(0,2)]);}save();document.getElementById('game').innerHTML=`<div class="crosswrap"><div class="cw-grid" style="grid-template-columns:repeat(${layout.cols},var(--cw))">${cells}</div></div><div class="clues">${layout.placements.map(pl=>`<button class="clue clue-choice ${pl.index===current?'chosen':''}" data-clue="${pl.index}" ${a.items[pl.index].done?'disabled':''}><strong>${pl.number} ${pl.dir==='h'?'→':'↓'} ${a.items[pl.index].done?'✓':''}</strong> ${esc(data[pl.index][1])}</button>`).join('')}</div><div class="hint"><strong>Pista asociada:</strong> ${esc(data[current][2])}<button class="btn secondary" id="read-clue">🔊 Escuchar pista</button></div><div class="wordbank">${a.bank.map(word=>`<button class="bank-word" data-word="${word}">${word}</button>`).join('')}</div><div class="actions"><button class="btn" id="check-word">Comprobar palabra</button><button class="btn secondary" id="skip-word">Continuar sin resolver esta pista</button></div>`;app.querySelectorAll('.clue-choice').forEach(b=>b.onclick=()=>{a.current=Number(b.dataset.clue);save();crossword();});app.querySelectorAll('.bank-word').forEach(b=>b.onclick=()=>{state.selected=b.dataset.word;app.querySelectorAll('.bank-word').forEach(x=>x.classList.toggle('selected',x===b));});document.getElementById('read-clue').onclick=()=>speak(data[current][1]+'. Pista: '+data[current][2]);document.getElementById('check-word').onclick=()=>{if(!state.selected){feedback('Escoge una palabra antes de comprobar.');return;}if(record(current,state.selected===data[current][0])){if(a.items[current].done)nextCross();}};document.getElementById('skip-word').onclick=()=>{skipItem(current);feedback('La palabra era '+data[current][0]+'. Este reto queda saltado, con 0 puntos.');nextCross();};}
  function nextCross(){const a=act('cross'),data=crossContent(),p=buildCrossword(data.map(x=>x[0])).placements.find(x=>x.index===a.current);for(let k=0;k<p.word.length;k++){const key=(p.r+(p.dir==='v'?k:0))+','+(p.c+(p.dir==='h'?k:0));const letter=document.querySelector('[data-cell="'+key+'"] .letter');if(letter)letter.textContent=p.word[k];}document.getElementById('check-word').disabled=true;document.getElementById('skip-word').disabled=true;app.querySelectorAll('.bank-word,.clue-choice').forEach(b=>b.disabled=true);const btn=document.createElement('button');btn.className='btn';btn.textContent=a.items.every(x=>x.done)?'Terminar crucigrama →':'Siguiente pista →';btn.onclick=()=>{if(a.items.every(x=>x.done))menu();else{a.current=a.items.findIndex(x=>!x.done);save();crossword();}};document.getElementById('feedback').after(btn);}
  function pairGame(visual){const key=visual?'shapes':'links',a=act(key),pairs=visual?content().shapes:content().links;state.selected=null;shell(visual?'Figuras que coinciden':'Enlaza las parejas','Elige una tarjeta a la izquierda y su pareja a la derecha. Un error se registra, pero puedes seguir intentando.');if(!a.order){a.order=shuffle([...pairs.keys()]);const previous=db.runs.slice(0,db.runs.findIndex(r=>r.id===run.id)).filter(r=>r.grade===run.grade).at(-1);if(JSON.stringify(a.order)===JSON.stringify(previous?.games[key]?.order))a.order.push(a.order.shift());}save();document.getElementById('game').innerHTML=`<div class="match"><div class="matchcol"><h3>${visual?'Figura':'Elige'}</h3>${pairs.map(([value],i)=>`<button class="tile left ${a.items[i].done?'matched':''}" data-id="${i}" ${a.items[i].done?'disabled':''}>${visual?figure(value):esc(value)}</button>`).join('')}</div><div class="matchcol"><h3>Encuentra</h3>${a.order.map(i=>`<button class="tile right ${a.items[i].done?'matched':''}" data-id="${i}" ${a.items[i].done?'disabled':''}>${esc(pairs[i][1])}</button>`).join('')}</div></div><div class="actions"><button class="btn secondary" id="skip-pair">Continuar sin resolver la pareja elegida</button></div>`;app.querySelectorAll('.left').forEach(b=>b.onclick=()=>{state.selected=Number(b.dataset.id);app.querySelectorAll('.left').forEach(x=>x.classList.toggle('selected',x===b));feedback('Busca su pareja a la derecha.');});app.querySelectorAll('.right').forEach(b=>b.onclick=()=>{if(state.selected===null){feedback('Primero elige una tarjeta de la izquierda.');return;}const i=state.selected;if(record(i,i===Number(b.dataset.id))&&a.items[i].done){updatePairs(i);}});function updatePairs(i){app.querySelectorAll(`.tile[data-id="${i}"]`).forEach(x=>{x.disabled=true;x.classList.remove('selected');x.classList.add('matched');});state.selected=null;if(a.items.every(x=>x.done)){document.getElementById('skip-pair').textContent='Terminar actividad →';document.getElementById('skip-pair').onclick=menu;}}document.getElementById('skip-pair').onclick=()=>{if(state.selected===null){feedback('Elige la pareja que quieres saltar.');return;}const i=state.selected;skipItem(i);feedback(`La pareja era: ${pairs[i][1]}. Se registra como saltada.`);updatePairs(i);};}
  function parseAnswer(raw){raw=raw.trim().replace(',','.');if(/^[-+]?\d+(?:\.\d+)?\s*\/\s*\d+(?:\.\d+)?$/.test(raw)){const[a,b]=raw.split('/').map(Number);return b? a/b:NaN;}return raw!==''?Number(raw):NaN;}
  function calculations(){const a=act('calcs');a.current=a.items.findIndex(x=>!x.done);shelledCalc();}
  function shelledCalc(){const a=act('calcs'),i=a.current,[q,answer,hint]=content().calcs[i];shell('Cálculos matemáticos','Escribe la respuesta. Puedes corregir después de un error o continuar sin resolver. Se conservan todos los errores.');document.getElementById('game').innerHTML=`<div class="calc-box"><div class="count">Reto ${i+1} de ${a.items.length}</div><div class="calc-prompt">${esc(q)}</div><label for="answer">Tu respuesta</label><br><input id="answer" inputmode="decimal" autocomplete="off" value="${esc(a.items[i].draft||'')}"><p class="small">Acepta punto o coma decimal; también fracciones como 3/4.</p><div class="actions" style="justify-content:center"><button class="btn" id="check-calc">Comprobar</button><button class="btn secondary" id="hint-calc">Una pista</button><button class="btn secondary" id="skip-calc">Continuar sin resolver</button></div></div>`;const input=document.getElementById('answer');input.oninput=()=>{a.items[i].draft=input.value;save();};const next=()=>{app.querySelectorAll('#game button').forEach(b=>b.disabled=true);input.disabled=true;const b=document.createElement('button');b.className='btn';b.textContent=a.items.every(x=>x.done)?'Terminar cálculos →':'Siguiente reto →';b.onclick=()=>{if(a.items.every(x=>x.done))menu();else{a.current=a.items.findIndex(x=>!x.done);shelledCalc();}};document.getElementById('feedback').after(b);};const check=()=>{if(a.items[i].done)return;if(!input.value.trim()){feedback('Escribe una respuesta antes de comprobar.');return;}const correct=Number.isFinite(parseAnswer(input.value))&&Math.abs(parseAnswer(input.value)-answer)<1e-9;record(i,correct);if(correct)next();};document.getElementById('check-calc').onclick=check;input.onkeydown=e=>{if(e.key==='Enter')check();};document.getElementById('hint-calc').onclick=()=>{feedback(hint);speak(hint);};document.getElementById('skip-calc').onclick=()=>{skipItem(i);feedback(`La respuesta era ${answer}. ${hint} Se registra como saltada.`);next();};}
  function memory(){const a=act('memory');state.flips=[];state.locked=false;const token=state.viewToken;shell('Memoria matemática','Voltea dos tarjetas y busca una pareja. Cada par que no coincide cuenta como un intento sin pareja. Puedes seguir aprendiendo.');if(!a.deck){a.deck=shuffle(content().memory.flatMap(([x,y],i)=>[{id:i,text:x},{id:i,text:y}]));const previous=db.runs.slice(0,db.runs.findIndex(r=>r.id===run.id)).filter(r=>r.grade===run.grade).at(-1);if(a.deck.map(x=>x.id).join(',')===previous?.games.memory?.deck?.map(x=>x.id).join(','))a.deck.push(a.deck.shift());}save();document.getElementById('game').innerHTML=`<div class="memory">${a.deck.map((card,i)=>`<button class="memory-card ${a.items[card.id].done?'matched':''}" data-index="${i}" ${a.items[card.id].done?'disabled':''} aria-label="Tarjeta ${i+1}">${a.items[card.id].done?esc(card.text):'?'}</button>`).join('')}</div><p class="count" id="mem-count">${a.items.filter(x=>x.done).length} de ${a.items.length} parejas</p><button class="btn secondary" id="skip-memory">Terminar memoria sin resolver las parejas restantes</button>`;const buttons=[...app.querySelectorAll('.memory-card')];buttons.forEach((el,i)=>el.onclick=()=>{if(state.locked||a.items[a.deck[i].id].done||state.flips.includes(i))return;el.textContent=a.deck[i].text;el.classList.add('revealed');state.flips.push(i);if(state.flips.length===2){const[x,y]=state.flips;if(a.deck[x].id===a.deck[y].id){record(a.deck[x].id,true);for(const j of[x,y]){buttons[j].classList.add('matched');buttons[j].disabled=true;}state.flips=[];document.getElementById('mem-count').textContent=`${a.items.filter(x=>x.done).length} de ${a.items.length} parejas`;if(a.items.every(x=>x.done)){document.getElementById('skip-memory').textContent='Terminar memoria →';document.getElementById('skip-memory').onclick=menu;}}else{a.items[a.deck[y].id].penalized=true;record(a.deck[x].id,false);state.locked=true;setTimeout(()=>{if(state.viewToken!==token)return;for(const j of[x,y]){buttons[j].textContent='?';buttons[j].classList.remove('revealed');}state.flips=[];state.locked=false;},1200);}}});document.getElementById('skip-memory').onclick=()=>{if(state.locked)return;a.items.forEach((x,i)=>{if(!x.done)skipItem(i);});state.viewToken++;menu();};}
  function download(text,type,filename){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function csvCell(value){let s=String(value??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"';}
  function exportCSV(){const headers=['ID','Sesion','Puesto','Nombre','Tipo','Integrantes','Grado','Puntaje_sobre_100','Correctas_primer_intento','Corregidas','Errores_incluye_memoria','Saltadas','Actividades_terminadas','Estado','Inicio','Fin'];const rows=db.runs.map(r=>{const s=stats(r);return[r.id,r.session,r.station,r.name,r.kind==='team'?'Equipo':'Estudiante',r.members,grades[r.grade].name,s.score,s.correct,s.corrected,s.errors,s.skipped,s.done,r.finished?'Terminada':'Pendiente',r.created,r.ended||''];});download('\uFEFF'+[headers,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8','math-resultados.csv');}
  function results(filterSession=db.session,filterGrade='all'){state.viewToken++;state.activity=null;const sessions=[...new Set(db.runs.map(r=>r.session))];if(!sessions.includes(filterSession)&&sessions.length)filterSession=sessions[0];const list=db.runs.filter(r=>(filterSession==='all'||r.session===filterSession)&&(filterGrade==='all'||r.grade===filterGrade));const winners=new Set();const groups=new Map();for(const r of list.filter(r=>r.finished)){const group=JSON.stringify([r.session,r.grade,r.kind,r.questions?.generation||0]);if(!groups.has(group))groups.set(group,[]);groups.get(group).push(r);}for(const eligible of groups.values()){const best=Math.max(...eligible.map(r=>stats(r).score));eligible.filter(r=>stats(r).score===best).forEach(r=>winners.add(r.id));}const sorted=[...list].sort((a,b)=>String(a.grade).localeCompare(String(b.grade))||Number(b.finished)-Number(a.finished)||stats(b).score-stats(a).score);app.innerHTML=`<div class="topbar"><button class="btn secondary" id="home">← Registro de participantes</button><button class="btn" id="csv">Descargar tabla CSV</button><button class="btn secondary" id="backup">Descargar copia completa</button></div><section class="panel"><h2>Resultados guardados en este puesto</h2><p>La mejor puntuación se destaca por sesión, grado y tipo de participación (estudiante o equipo), entre quienes terminaron los cinco juegos. Los empates se conservan. Los retos anteriores se comparan aparte de los renovados.</p><div class="formgrid"><label>Sesión<select id="filter-session"><option value="all">Todas las sesiones</option>${sessions.map(s=>`<option value="${esc(s)}" ${s===filterSession?'selected':''}>${esc(s)}</option>`).join('')}</select></label><label>Grado<select id="filter-grade"><option value="all">Todos los grados</option>${Object.keys(grades).map(g=>`<option value="${g}" ${g===filterGrade?'selected':''}>${grades[g].name}</option>`).join('')}</select></label></div><div class="tablewrap"><table><thead><tr><th>Participante</th><th>Grado</th><th>Puntaje</th><th>Aciertos iniciales</th><th>Corregidas</th><th>Errores</th><th>Saltadas</th><th>Juegos</th><th>Estado</th></tr></thead><tbody>${sorted.map(r=>{const s=stats(r);return`<tr class="${winners.has(r.id)?'winner':''}"><td>${winners.has(r.id)?'🏆 ':''}${esc(r.name)}<small>${r.kind==='team'?'Equipo':'Estudiante'} · ${esc(r.station)} · ${esc(r.session)} · ${r.questions?'Retos renovados':'Retos anteriores'}${r.members?'<br>'+esc(r.members):''}<br>${esc(new Date(r.created).toLocaleString('es-US'))}</small></td><td>${grades[r.grade].name}</td><td><strong>${s.score.toFixed(1)}/100</strong></td><td>${s.correct}</td><td>${s.corrected}</td><td>${s.errors}</td><td>${s.skipped}</td><td>${s.done}/5</td><td>${r.finished?'Terminada':`<button class="btn secondary resume-run" data-run="${esc(r.id)}">Continuar</button>`}</td></tr>`;}).join('')||'<tr><td colspan="9">Todavía no hay participaciones en esta selección.</td></tr>'}</tbody></table></div><div class="hint"><strong>Memoria:</strong> los intentos sin pareja se incluyen en errores; no son necesariamente desconocimiento de matemáticas. Esta tabla describe el desempeño en el juego, no sustituye una evaluación escolar.</div><details><summary>Reunir resultados de varias computadoras</summary><p>En cada puesto descarga la copia completa (JSON). Tráela a una computadora y usa «Importar copia» para reunir los registros. Los archivos CSV permiten revisar la tabla en una hoja de cálculo.</p><label>Importar copia<input type="file" id="import" accept=".json,application/json"></label><p id="import-status" role="status"></p></details></section>`;document.getElementById('home').onclick=home;document.getElementById('csv').onclick=exportCSV;document.getElementById('backup').onclick=()=>download(JSON.stringify(db,null,2),'application/json','math-copia-completa.json');document.getElementById('filter-session').value=filterSession;document.getElementById('filter-session').onchange=e=>results(e.target.value,filterGrade);document.getElementById('filter-grade').onchange=e=>results(filterSession,e.target.value);app.querySelectorAll('.resume-run').forEach(b=>b.onclick=()=>{run=db.runs.find(r=>r.id===b.dataset.run);db.activeId=run.id;save();menu();});document.getElementById('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('La copia es demasiado grande.');const incoming=JSON.parse(await file.text());validateBackup(incoming);let n=0;for(const r of incoming.runs){const existing=db.runs.find(x=>x.id===r.id);if(!existing){db.runs.push(r);n++;}else if(r.updated>existing.updated){db.runs[db.runs.indexOf(existing)]=r;n++;}}if(run)run=db.runs.find(r=>r.id===run.id)||null;save();results(filterSession,filterGrade);document.getElementById('import-status').textContent=`${n} registros incorporados o actualizados.`;}catch(error){document.getElementById('import-status').textContent='No se importó: '+error.message;}};}
  function validateBackup(data){if(data?.version!==2||!Array.isArray(data.runs)||data.runs.length>5000)throw Error('Formato de copia no válido.');for(const r of data.runs){if(typeof r.id!=='string'||typeof r.name!=='string'||typeof r.session!=='string'||typeof r.station!=='string'||!grades[r.grade]||typeof r.games!=='object'||!r.games||!Number.isFinite(Date.parse(r.created))||!Number.isFinite(Date.parse(r.updated)))throw Error('Hay un registro no válido.');if(r.questions){const q=r.questions;if(q.generation!==1||!Array.isArray(q.calcs)||q.calcs.length!==5||q.calcs.some(x=>!Array.isArray(x)||typeof x[0]!=='string'||!Number.isFinite(x[1])||typeof x[2]!=='string'))throw Error('Retos no válidos.');for(const key of ['links','shapes','memory'])if(!Array.isArray(q[key])||q[key].length!==(key==='memory'?6:4)||q[key].some(x=>!Array.isArray(x)||x.length!==2||x.some(y=>typeof y!=='string')))throw Error('Parejas no válidas.');if(!Number.isInteger(q.crossVersion)||!crossVariants[r.grade][q.crossVersion]||JSON.stringify(q.cross)!==JSON.stringify(crossVariants[r.grade][q.crossVersion]))throw Error('Crucigrama no válido.');if(!q.visualStyle||!Number.isFinite(q.visualStyle.hue)||q.visualStyle.hue<0||q.visualStyle.hue>360)throw Error('Estilo no válido.');}for(const [key,a]of Object.entries(r.games)){if(!activities.some(x=>x[0]===key)||!Array.isArray(a.items)||a.items.length!==totalItems(key,r.grade))throw Error('Actividad no válida.');for(const item of a.items)if(!Number.isInteger(item.errors)||item.errors<0||![0,.5,1].includes(item.factor)||!['pending','correct','corrected','skipped'].includes(item.status)||typeof item.done!=='boolean')throw Error('Puntaje no válido.');if(a.order&&(!Array.isArray(a.order)||a.order.length!==a.items.length||new Set(a.order).size!==a.items.length||a.order.some(i=>!Number.isInteger(i)||i<0||i>=a.items.length)))throw Error('Orden no válido.');if(a.bank&&(!Array.isArray(a.bank)||a.bank.some(w=>typeof w!=='string'||!/^[A-Z]+$/.test(w))))throw Error('Palabras no válidas.');if(a.deck&&(!Array.isArray(a.deck)||a.deck.length!==12||a.deck.some(x=>!Number.isInteger(x.id)||x.id<0||x.id>=6||typeof x.text!=='string')))throw Error('Memoria no válida.');}}}

  function figure(kind){const visual=run?.questions?.visualStyle;const style=visual?`style="filter:hue-rotate(${visual.hue}deg)"`:'';const base=(inside)=>`<svg ${style} viewBox="0 0 160 100" role="img" aria-label="Figura para identificar" xmlns="http://www.w3.org/2000/svg">${inside}</svg>`;const fill='#45b6ad',stroke='#163b52';
    if(kind==='circle')return base(`<circle cx="80" cy="50" r="35" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`);
    if(kind==='oval')return base(`<ellipse cx="80" cy="50" rx="58" ry="30" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`);
    if(kind==='pentagon')return base(`<polygon points="80,8 130,39 111,91 49,91 30,39" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`);
    if(kind==='octagon')return base(`<polygon points="58,10 102,10 130,38 130,66 102,94 58,94 30,66 30,38" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`);
    if(kind.startsWith('fraction:')){const [_,den,num]=kind.split(':').map(Number);let inside='';for(let i=0;i<den;i++)inside+=`<rect x="${12+i*136/den}" y="29" width="${136/den}" height="42" fill="${i<num?fill:'#fff'}" stroke="${stroke}" stroke-width="2"/>`;return base(inside);}
    if(kind==='triangle')return base(`<polygon points="80,10 27,87 133,87" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`);
    if(kind==='square')return base(`<rect x="45" y="15" width="70" height="70" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`);
    if(kind==='rectangle')return base(`<rect x="20" y="27" width="120" height="48" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`);
    if(kind==='hexagon')return base(`<polygon points="45,16 115,16 145,50 115,84 45,84 15,50" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`);
    if(kind.startsWith('bar')){const spec={barHalf:[2,1],barThird:[3,1],barTwoThirds:[3,2],barThreeFourths:[4,3]}[kind];let inner='';for(let i=0;i<spec[0];i++)inner+=`<rect x="${12+i*136/spec[0]}" y="29" width="${136/spec[0]}" height="42" fill="${i<spec[1]?fill:'#fff'}" stroke="${stroke}" stroke-width="2"/>`;return base(inner)}
    if(kind.startsWith('array')){const [r,col]=kind.slice(5).split('x').map(Number);let inner='';const gap=Math.min(18,110/col);for(let i=0;i<r;i++)for(let j=0;j<col;j++)inner+=`<circle cx="${80-(col-1)*gap/2+j*gap}" cy="${50-(r-1)*gap/2+i*gap}" r="${Math.min(6,gap/3)}" fill="${fill}" stroke="${stroke}"/>`;return base(inner)}
    if(['acute','rightAngle','obtuse','straight'].includes(kind)){const end={acute:[124,21],rightAngle:[80,12],obtuse:[37,27],straight:[20,74]}[kind];return base(`<circle cx="80" cy="74" r="5" fill="${stroke}"/><line x1="80" y1="74" x2="140" y2="74" stroke="${stroke}" stroke-width="5"/><line x1="80" y1="74" x2="${end[0]}" y2="${end[1]}" stroke="${fill}" stroke-width="5"/>`)}
    if(kind==='cube')return base(`<polygon points="45,33 82,15 119,33 82,51" fill="#9be4db" stroke="${stroke}" stroke-width="2"/><polygon points="45,33 82,51 82,88 45,70" fill="${fill}" stroke="${stroke}" stroke-width="2"/><polygon points="82,51 119,33 119,70 82,88" fill="#278f9c" stroke="${stroke}" stroke-width="2"/>`);
    if(kind==='prism')return base(`<polygon points="20,34 85,34 127,17 63,17" fill="#9be4db" stroke="${stroke}" stroke-width="2"/><polygon points="20,34 85,34 85,80 20,80" fill="${fill}" stroke="${stroke}" stroke-width="2"/><polygon points="85,34 127,17 127,65 85,80" fill="#278f9c" stroke="${stroke}" stroke-width="2"/>`);
    if(kind==='cylinder')return base(`<rect x="49" y="27" width="62" height="51" fill="${fill}" stroke="${stroke}" stroke-width="2"/><ellipse cx="80" cy="27" rx="31" ry="12" fill="#9be4db" stroke="${stroke}" stroke-width="2"/><path d="M49 78 Q80 96 111 78" fill="none" stroke="${stroke}" stroke-width="2"/>`);
    return base(`<polygon points="36,70 68,25 100,70" fill="${fill}" stroke="${stroke}" stroke-width="2"/><polygon points="68,25 111,15 143,60 100,70" fill="#9be4db" stroke="${stroke}" stroke-width="2"/><line x1="100" y1="70" x2="143" y2="60" stroke="${stroke}" stroke-width="2"/>`)
  }

  renderHome();
