<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="Rene M. Velazquez Avila"><title>Estimo, mido y encuentro la diferencia</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fa;color:#203448}header{background:#173f66;color:white;padding:24px}.w{max-width:920px;margin:auto}.home{color:white;font-weight:bold}.c{background:white;margin:20px auto;padding:25px;border-radius:18px;box-shadow:0 7px 20px #0001}.p{height:12px;background:#dfe8ef;border-radius:20px;overflow:hidden}.b{height:100%;background:#3479aa}.stage{color:#28658f;font-weight:bold;margin-top:15px}.goal,.tip{background:#eef7fc;border-left:5px solid #3479aa;padding:14px;border-radius:10px;margin:15px 0}.q{font-size:1.2rem;font-weight:bold}.choices{display:grid;gap:9px}.ch{padding:12px;border:2px solid #d9e4ec;border-radius:11px;cursor:pointer}.ch:hover{border-color:#72a4c6}button{padding:11px 16px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.pri{background:#245f90;color:white}.sec{background:#e7eef3}.act{display:flex;justify-content:space-between;margin-top:20px}.fb{margin-top:14px;padding:11px;border-radius:9px;font-weight:bold}.ok{background:#e8f7eb;color:#17642c}.no{background:#fff0e3;color:#854710}.j{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:5px;font-size:1.25rem;font-weight:bold;margin:20px 0}.n{padding:8px 11px;background:#eef4f8;border-radius:9px}.a{color:#2c6f9f}.tape{max-width:620px;margin:20px auto}.whole{height:58px;border:3px solid #2d5f85;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.25rem}.parts{display:flex;height:58px;margin-top:12px}.part{border:3px solid #2d5f85;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem}.left{width:56%}.right{width:44%;border-left:0}.eq{text-align:center;font-size:1.5rem;font-weight:bold;margin:15px}footer{text-align:center;padding:24px;color:#667987}</style></head><body>
<header><div class=w><b>ESPACIO DE APRENDIZAJE · SEGUNDO GRADO</b><h1>📏 Estimo, mido y encuentro la diferencia</h1><p>Comparo · Cuento saltos · Diagrama de cintas · Sumo · Resto</p><a class=home href="./">🏠 Volver al inicio</a></div></header><main class=w><div class=c><div class=p><div id=bar class=b></div></div><div id=app></div></div></main><footer>© 2026 Rene M. Velazquez Avila · Todos los derechos reservados.<br>Espacio de Aprendizaje — Segundo Grado</footer>
<script>
const S=[
["1 · Comprendo","¿Qué significa estimar?","Antes de medir, Ana piensa que un lápiz mide aproximadamente 9 cm. ¿Qué hizo?",["Hizo una estimación","Ya obtuvo la medida exacta","Hizo una resta"],0,"Estimar es pensar aproximadamente cuánto puede medir algo antes de medirlo."],
["2 · Comparo","Estimación y medida","Estimé 5 cm y después medí 9 cm. ¿Cuál es la cantidad mayor?",["9 cm","5 cm","4 cm"],0,"Primero identifico el mayor y el menor."],
["2 · Comparo","Encuentro el menor","¿Cuál es la cantidad menor?",["5 cm","9 cm","14 cm"],0,"Comenzamos en la cantidad menor."],
["3 · Cuento saltos","No cuento números: cuento saltos","Para ir de 5 hasta 9, ¿cuántos saltos doy?",["4","5","9"],0,"No cuento los números. Cuento cuánto avanzo.","j1"],
["4 · Completo la suma","Lo que avancé es la diferencia","Completa: 5 + ___ = 9",["4","5","14"],0,"5 + 4 = 9. Los 4 saltos son la diferencia."],
["5 · Diagrama de cintas","Comprendo la parte que falta","En el diagrama, ¿qué representa el signo ?",["Lo que falta para llegar del menor al mayor","El número menor","La unidad"],0,"La parte ? representa la diferencia.","t1"],
["5 · Diagrama de cintas","Identifico el total","Entre 5 y 9, ¿qué valor representa la cantidad mayor o total?",["9","5","4"],0,"9 es la cantidad mayor.","t1"],
["6 · Completo el diagrama","Nuevo ejemplo","7 → 8 → 9 → 10. ¿Cuál es la diferencia?",["3 cm","7 cm","17 cm"],0,"Son 3 saltos.","j2"],
["6 · Completo el diagrama","Encuentro la parte","Si 7 + ? = 10, ¿qué número va en ?",["3","10","7"],0,"La diferencia es 3.","t2"],
["7 · Suma y resta","Relaciono las operaciones","Si 5 + 4 = 9, ¿cuál resta relacionada es correcta?",["9 − 5 = 4","5 − 4 = 9","9 + 5 = 4"],0,"La suma y la resta describen la misma comparación."],
["8 · Medición","Aplico la estrategia","Mateo estimó 12 cm y la medida exacta fue 16 cm. ¿Cuál es la diferencia?",["4 cm","28 cm","12 cm"],0,"12 → 13 → 14 → 15 → 16: cuatro saltos.","j3"],
["9 · Cambio la relación","La estimación puede ser mayor","Sofía estimó 15 cm y la medida exacta fue 11 cm. ¿Desde cuál número comenzamos?",["11","15","4"],0,"Empiezo en el menor y avanzo hasta el mayor."],
["9 · Cambio la relación","Cuento los saltos","11 → 12 → 13 → 14 → 15. ¿Cuál es la diferencia?",["4 cm","5 cm","26 cm"],0,"Hay 4 saltos, aunque vemos 5 números.","j4"],
["10 · Construyo","Escribo la resta","Estimación: 14 cm. Medida: 20 cm. ¿Qué oración encuentra la diferencia?",["20 − 14 = 6","14 − 6 = 20","20 + 14 = 34"],0,"Mayor − menor = diferencia."],
["11 · Lee · Dibuja · Escribe","Resuelvo paso a paso","Elena estimó 18 cm. La medida real fue 13 cm. ¿Cuál es la diferencia?",["5 cm","31 cm","13 cm"],0,"13 → 14 → 15 → 16 → 17 → 18: cinco saltos."],
["12 · Lo hago solo","⭐ Reto independiente","Carlos estimó 17 cm. Al medir descubrió que mide 12 cm. ¿Cuál es la diferencia?",["5 cm","29 cm","12 cm"],0,"¡Excelente! Ya puedes comparar y encontrar la diferencia.","final"]];
let i=0;const app=document.getElementById("app"),bar=document.getElementById("bar");
function vis(x){let j=(arr)=>`<div class=j>${arr.map((v,k)=>`<span class=n>${v}</span>${k<arr.length-1?`<span class=a>→${k+1}</span>`:""}`).join("")}</div>`;
if(x=="j1")return j([5,6,7,8,9])+`<div class=tip><b>Recuerda:</b> No cuento los números. Cuento cuánto avanzo.</div>`;
if(x=="j2")return j([7,8,9,10]);if(x=="j3")return j([12,13,14,15,16]);if(x=="j4")return j([11,12,13,14,15]);
if(x=="t1")return `<div class=tape><div class=whole>9</div><div class=parts><div class="part left">5</div><div class="part right">?</div></div></div><div class=eq>5 + ? = 9</div>`;
if(x=="t2")return `<div class=tape><div class=whole>10</div><div class=parts><div class="part left" style="width:70%">7</div><div class="part right" style="width:30%">?</div></div></div><div class=eq>7 + ? = 10</div>`;return""}
function render(){let s=S[i];bar.style.width=(100*(i+1)/S.length)+"%";app.innerHTML=`<div class=stage>${s[0]} · Paso ${i+1} de ${S.length}</div><h2>${s[1]}</h2>${i==0?'<div class=goal><b>🎯 Meta:</b> Puedo comparar una estimación con una medida exacta, encontrar la diferencia y representarla con un diagrama de cintas y una oración numérica.</div>':''}${vis(s[6])}<p class=q>${s[2]}</p><div class=choices>${s[3].map((x,n)=>`<label class=ch><input type=radio name=a value=${n}> ${x}</label>`).join("")}</div><div id=f></div><div class=act>${i?'<button class=sec onclick="i--;render()">← Atrás</button>':'<span></span>'}<button class=pri onclick=check()>Comprobar</button></div>`}
function check(){let s=S[i],a=document.querySelector("input[name=a]:checked"),f=document.getElementById("f");if(!a){f.className="fb no";f.textContent="Selecciona una respuesta.";return}if(+a.value==s[4]){f.className="fb ok";f.innerHTML="✓ Correcto. "+s[5]+(s[6]=="final"?"<br><br><b>Empiezo en el menor → cuento los saltos → construyo el diagrama → escribo la resta.</b>":"");if(i<S.length-1)setTimeout(()=>{i++;render()},900)}else{f.className="fb no";f.textContent="Todavía no. Identifica el menor y el mayor y piensa cuánto debes avanzar."}}render();
</script></body></html>
