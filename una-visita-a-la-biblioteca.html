<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="Rene M. Velazquez Avila"><title>Una visita a la biblioteca — Segundo Grado</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fa;color:#243746}header{background:#173f66;color:#fff;padding:24px}.wrap{max-width:900px;margin:auto}h1{margin:5px 0}.home{color:#fff;font-weight:bold}.box{background:#fff;margin:20px auto;padding:25px;border-radius:18px;box-shadow:0 7px 20px #0001}.progress{height:11px;background:#dfe8ef;border-radius:20px;overflow:hidden}.bar{height:100%;background:#3479aa}.stage{font-weight:bold;color:#28658f;margin-top:16px}.story,.builder{background:#eef7fc;padding:17px;border-radius:12px;margin:16px 0;border-left:5px solid #3479aa}.q{font-size:1.2rem;font-weight:bold}.choices{display:grid;gap:9px}.choice{padding:12px;border:2px solid #d9e4ec;border-radius:11px;cursor:pointer}.choice:hover{border-color:#72a4c6}button{padding:11px 17px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.primary{background:#245f90;color:white}.secondary{background:#e7eef3}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.feedback{margin-top:14px;padding:11px;border-radius:9px;font-weight:bold}.good{background:#e8f7eb;color:#17642c}.bad{background:#fff0e3;color:#854710}.order{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:8px;padding:11px;border:2px solid #dce6ed;border-radius:10px}.organizer{display:grid;grid-template-columns:1fr 1fr;gap:10px}.organizer div{background:#f6f9fb;padding:10px;border-radius:10px}.organizer input,textarea{width:100%;padding:11px;border:2px solid #cadbe6;border-radius:9px;font:inherit}.check label{display:block;margin:7px 0}footer{text-align:center;padding:24px;color:#667987}@media(max-width:600px){.organizer{grid-template-columns:1fr}}@media print{header,.actions,.progress,.stage{display:none}.box{box-shadow:none}}
</style></head><body><header><div class="wrap"><b>ESPACIO DE APRENDIZAJE · SEGUNDO GRADO</b><h1>📚 Una visita a la biblioteca</h1><div>Leo · Comprendo · Construyo · Creo</div><br><a class="home" href="./">🏠 Volver al inicio</a></div></header><main class="wrap"><div class="box"><div class="progress"><div id="bar" class="bar"></div></div><div id="app"></div></div></main><footer>© 2026 Rene M. Velazquez Avila · Todos los derechos reservados.<br>Espacio de Aprendizaje — Segundo Grado</footer><script>
const text="El martes, Mateo fue a la biblioteca de la escuela con su clase. Al entrar, la bibliotecaria les mostró diferentes libros. Mateo caminó entre los estantes y encontró un libro sobre animales del océano. Se sentó junto a su amiga Elena y comenzó a leer. Después, escogió el libro para llevarlo a casa. Antes de regresar al salón, Mateo agradeció a la bibliotecaria. Estaba contento porque quería aprender más sobre los animales del mar.";
const S=[
["1 · Observo y pienso","Antes de leer","¿Qué podemos hacer en una biblioteca?",["Leer y buscar libros","Jugar fútbol","Cocinar"],0],
["1 · Observo y pienso","Activo mis ideas","¿Qué objeto esperas encontrar en una biblioteca?",["Libros","Semáforos","Bicicletas"],0],
["2 · Leo y descubro","Lee con atención","¿Dónde ocurre principalmente la historia?",["En una biblioteca","En un parque","En una tienda"],0,"story"],
["3 · Encuentro información","Busco quién","¿Quién es el personaje principal?",["Mateo","Elena","La bibliotecaria"],0],
["3 · Encuentro información","Busco dónde","¿A dónde fue Mateo?",["A la biblioteca de la escuela","A su casa","Al océano"],0],
["3 · Encuentro información","Busco compañía","¿Con quién fue Mateo?",["Con su clase","Solo","Con su familia"],0],
["3 · Encuentro información","Busco detalles","¿Qué encontró entre los estantes?",["Un libro sobre animales del océano","Una pelota","Una botella"],0],
["3 · Encuentro información","Busco detalles","¿Con quién se sentó a leer?",["Con Elena","Con su mamá","Con Luis"],0],
["4 · Pienso sobre lo leído","Comprendo una causa","¿Por qué Mateo estaba contento?",["Porque quería aprender más sobre los animales del mar","Porque terminó la escuela","Porque encontró una pelota"],0],
["4 · Pienso sobre lo leído","Pienso en su decisión","¿Para qué escogió el libro?",["Para llevarlo a casa","Para esconderlo","Para regalarlo"],0],
["4 · Pienso sobre lo leído","Hago una inferencia","¿Qué acción muestra que Mateo fue amable?",["Agradeció a la bibliotecaria","Caminó entre los estantes","Se sentó"],0],
["5 · Construyo una oración","¿QUIÉN?","Selecciona el sujeto.",["Mateo","Biblioteca","Océano"],0,"Mateo"],
["5 · Construyo una oración","¿QUÉ HIZO?","Selecciona la acción.",["encontró","azul","biblioteca"],0,"encontró"],
["5 · Construyo una oración","¿QUÉ?","¿Qué encontró?",["un libro","un salón","una mesa"],0,"un libro"],
["5 · Construyo una oración","¿SOBRE QUÉ?","Completa la idea.",["sobre animales del océano","sobre una pelota","sobre un banco"],0,"sobre animales del océano."],
["6 · Hago crecer mi oración","Añadir detalles","¿Cuál oración comunica más información?",["Mateo leyó un libro sobre animales del océano junto a su amiga Elena.","Mateo leyó.","Mateo."],0],
["6 · Hago crecer mi oración","Reconozco detalles","«junto a su amiga Elena» nos dice…",["Con quién","Cuándo","Por qué"],0],
["7 · Conecto mis ideas","Uso conectores","Mateo encontró un libro. ___, se sentó a leer con Elena.",["Después","Porque","Aunque"],0],
["7 · Conecto mis ideas","Reconozco el inicio","¿Qué expresión indica el comienzo?",["Al entrar","Después","Al final"],0],
["7 · Conecto mis ideas","Reconozco la secuencia","¿Qué palabra ayuda a contar lo que ocurrió más tarde?",["Después","Libro","Mateo"],0]
];
const orders=[
["Mateo llegó a la biblioteca.","Encontró un libro sobre animales del océano.","Leyó junto a Elena.","Escogió el libro para llevarlo a casa.","Agradeció a la bibliotecaria."],
["El martes, Mateo fue a la biblioteca con su clase.","Allí encontró un libro sobre animales del océano.","Después, leyó junto a su amiga Elena.","Mateo escogió el libro para llevarlo a casa.","Antes de regresar al salón, agradeció a la bibliotecaria."]
];
let i=0,pieces=[],ord=[],mode=0,total=S.length+4;
const app=document.getElementById("app"),bar=document.getElementById("bar");
function buttons(){return `<div class=actions>${i?'<button class=secondary onclick=back()>← Atrás</button>':'<span></span>'}<button class=primary onclick=check()>Comprobar</button></div>`}
function render(){
 bar.style.width=((i+1)/total*100)+"%";
 if(i<S.length){let s=S[i];app.innerHTML=`<div class=stage>${s[0]} · Paso ${i+1} de ${total}</div><h2>${s[1]}</h2>${s[5]=="story"?`<div class=story><b>📖 Una visita a la biblioteca</b><br><br>${text}</div>`:""}<p class=q>${s[2]}</p><div class=choices>${s[3].map((x,n)=>`<label class=choice><input type=radio name=a value=${n}> ${x}</label>`).join("")}</div>${i>=11&&i<=14?`<div class=builder><b>🧩 Mi oración:</b> ${pieces.join(" ")}</div>`:""}<div id=f></div>${buttons()}`}
 else if(i==S.length) orderScreen(0,"8 · Ordeno acontecimientos","Coloca los acontecimientos en el orden correcto.");
 else if(i==S.length+1) orderScreen(1,"9 · Construyo mi párrafo","Organiza las oraciones para formar un párrafo coherente.");
 else if(i==S.length+2) organizer();
 else creative();
}
function check(){let s=S[i],a=document.querySelector("input[name=a]:checked"),f=document.getElementById("f");if(!a){f.className="feedback bad";f.textContent="Selecciona una respuesta.";return}if(+a.value==s[4]){if(typeof s[5]=="string"&&s[5]!="story"&&!pieces.includes(s[5]))pieces.push(s[5]);f.className="feedback good";f.textContent="✓ Muy bien. Continúa construyendo.";setTimeout(()=>{i++;render()},400)}else{f.className="feedback bad";f.textContent="Todavía no. Vuelve a leer y prueba otra vez."}}
function back(){if(i>0){i--;ord=[];render()}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function orderScreen(n,title,q){if(!ord.length){ord=shuffle(orders[n]);if(JSON.stringify(ord)==JSON.stringify(orders[n]))[ord[0],ord[1]]=[ord[1],ord[0]]}app.innerHTML=`<div class=stage>${title} · Paso ${i+1} de ${total}</div><h2>${q}</h2><div class=order>${ord.map((x,k)=>`<div class=row><span>${x}</span><span><button onclick=mv(${k},-1)>↑</button> <button onclick=mv(${k},1)>↓</button></span></div>`).join("")}</div><div id=f></div><div class=actions><button class=secondary onclick=back()>← Atrás</button><button class=primary onclick=verifyOrder(${n})>Comprobar orden</button></div>`}
function mv(k,d){let j=k+d;if(j<0||j>=ord.length)return;[ord[k],ord[j]]=[ord[j],ord[k]];render()}
function verifyOrder(n){let f=document.getElementById("f");if(JSON.stringify(ord)==JSON.stringify(orders[n])){f.className="feedback good";f.textContent="✓ Excelente. El orden es correcto.";setTimeout(()=>{i++;ord=[];render()},500)}else{f.className="feedback bad";f.textContent="Revisa: ¿qué ocurrió primero, después y al final?"}}
function organizer(){let qs=["¿Quién?","¿Dónde?","¿Qué encontró?","¿Qué hizo?","¿Qué ocurrió después?","¿Cómo terminó?"];app.innerHTML=`<div class=stage>10 · Organizo antes de escribir · Paso ${i+1} de ${total}</div><h2>Mi organizador de ideas</h2><p>Escribe una idea breve en cada espacio.</p><div class=organizer>${qs.map((q,n)=>`<div><b>${q}</b><input id=o${n}></div>`).join("")}</div><div class=builder><b>Conectores:</b> Primero · Allí · Después · Al final</div><div id=f></div><div class=actions><button class=secondary onclick=back()>← Atrás</button><button class=primary onclick=orgCheck()>Continuar</button></div>`}
function orgCheck(){let f=document.getElementById("f"),ok=[0,1,2,3,4,5].every(n=>document.getElementById("o"+n).value.trim().length>1);if(ok){i++;render()}else{f.className="feedback bad";f.textContent="Completa todas las partes del organizador."}}
function creative(){app.innerHTML=`<div class=stage>11 · AHORA CREO YO · Paso ${i+1} de ${total}</div><h2>🌟 Imagina tu propia visita</h2><div class=story><b>Tu reto creativo:</b> Imagina que visitas una biblioteca. Decide con quién vas, qué libro encuentras, de qué trata, dónde lees, qué haces después y cómo termina tu visita.</div><p class=q>Escribe un párrafo original de 4 o 5 oraciones.</p><textarea id=w rows=9 placeholder="Escribe aquí tu historia..."></textarea><div class=check><h3>✅ Reviso mi trabajo</h3>${["Comencé con mayúscula.","Escribí oraciones completas.","Organicé mis ideas.","Utilicé conectores.","Coloqué punto al terminar.","Revisé mi trabajo."].map(x=>`<label><input type=checkbox> ${x}</label>`).join("")}</div><div id=f></div><div class=actions><button class=secondary onclick=back()>← Atrás</button><button class=secondary onclick=window.print()>🖨️ Imprimir</button><button class=primary onclick=finish()>Terminé</button></div>`}
function finish(){let w=document.getElementById("w").value.trim(),f=document.getElementById("f");if(w.length<45){f.className="feedback bad";f.textContent="Tu historia necesita un poco más. Escribe 4 o 5 oraciones completas."}else{f.className="feedback good";f.innerHTML="🌟 ¡Excelente! Leíste, comprendiste, organizaste y creaste tu propio texto."}}
render();
</script></body></html>
